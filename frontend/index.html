.cc-p{display:none;justify-self:start;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:#8fbf5f;color:#172815;font-weight:700;font-size:13px}
.cc.on .cc-p{display:inline-flex;animation:pop .5s ease}
.cc-i{position:relative;overflow:hidden;border-radius:18px;align-self:stretch;min-height:96px}
.cc-i img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.beam{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.cc.on .beam{animation:sweep 1.1s ease .15s 1}
.cc.on .cc-i img{animation:drive .75s cubic-bezier(.2,.8,.2,1)}
@keyframes sweep{to{transform:translateX(130%)}}
@keyframes drive{from{transform:translateX(-35%) scale(1.2);filter:blur(5px);opacity:.4}}
.cc-go{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:0;background:#e9eee0;color:#172815;display:grid;place-items:center;cursor:pointer;z-index:2}
.cc{cursor:pointer}
.cc-go:focus-visible{outline:3px solid #e9eee0;outline-offset:3px}
.cc.on .cc-go{background:#8fbf5f}.cc.on .cc-go svg{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.25)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.cc.on::before,.cc.on .beam,.cc.on .cc-i img,.cc.on .cc-p,.cc.on .cc-go svg{animation:none}}
/* phase 4: steps, push, success */
ol.steps{position:relative}
ol.steps::before,ol.steps::after{content:"";position:absolute;left:12.5%;top:14px;height:4px;border-radius:4px}
ol.steps::before{width:75%;background:var(--ln)}
ol.steps::after{width:var(--b,0%);background:var(--lf);animation:sg .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes sg{from{width:var(--a,0%)}}
ol.steps li{position:relative;z-index:1}
ol.steps li.done::before{content:"\2713"}
ol.steps li[aria-current="step"]::before{animation:sp 1.8s ease-out infinite}
@keyframes sp{0%{box-shadow:0 0 0 0 rgba(103,139,75,.55)}70%,100%{box-shadow:0 0 0 10px rgba(103,139,75,0)}}
.pw{text-align:center;display:grid;justify-items:center;gap:12px;padding:26px 18px}
.pw h3{font-size:26px}.pw .sub{margin:0}
.ring{position:relative;width:132px;height:132px;display:grid;place-items:center}
.ring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--ln);stroke-width:6}
.rf{fill:none;stroke:var(--lf);stroke-width:6;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:0;animation:cd 15s linear forwards}
@keyframes cd{to{stroke-dashoffset:276.5}}
.ph{position:relative;width:78px;height:78px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;animation:buzz 1.8s ease-in-out infinite}
.ph::before,.ph::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--lf);animation:rip 2s ease-out infinite}
.ph::after{animation-delay:1s}
@keyframes rip{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
@keyframes buzz{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}75%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}85%{transform:rotate(0)}}
.cd{font-weight:700;color:var(--mu)}.cd b{color:var(--ink);font:800 20px Syne,sans-serif}
.ps{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:8px;text-align:left;width:100%;max-width:320px}
.ps li{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--mu)}
.ps li::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln)}
.ps li.d{color:var(--ink)}.ps li.d::before{content:"\2713";background:var(--lf);border-color:var(--lf);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1}
.ps li.a{color:var(--ink)}.ps li.a::before{border-top-color:var(--lf);animation:spin2 .9s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.ck{position:relative;width:132px;height:132px;animation:pop3 .5s ease .7s}
.ck svg{width:132px;height:132px;overflow:visible}
.ckc{fill:var(--ink);stroke:var(--lf);stroke-width:5;stroke-dasharray:276.5;stroke-dashoffset:276.5;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);animation:dr .7s ease forwards}
.ckp{fill:none;stroke:var(--bg);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:62;stroke-dashoffset:62;animation:dr .45s ease .6s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes pop3{50%{transform:scale(1.08)}}
.ck i{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--lf);opacity:0;animation:bst .8s ease-out .7s forwards}
.ck i:nth-of-type(even){background:var(--sg)}
@keyframes bst{from{opacity:1;transform:rotate(var(--r)) translateY(-52px)}to{opacity:0;transform:rotate(var(--r)) translateY(-92px) scale(.4)}}
@media(prefers-reduced-motion:reduce){.rf{animation:none}.ph,.ph::before,.ph::after,.ps li.a::before,ol.steps li[aria-current="step"]::before,ol.steps::after,.ck{animation:none}.ckc,.ckp{animation:none;stroke-dashoffset:0}.ck i{display:none}}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--card);border-radius:99px;padding:4px;margin:14px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:44px;padding:0 8px;border:0;border-radius:99px;background:transparent;color:var(--mu);font:600 15px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tp{animation:tin .28s ease}.tp:focus-visible{outline:none}.tp>.cab{margin-top:0}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.tp{animation:none}}
@media print{header,footer,.demo,.noprint,.skip{display:none!important}body{background:#fff}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.prog span{animation-duration:.01s}}
